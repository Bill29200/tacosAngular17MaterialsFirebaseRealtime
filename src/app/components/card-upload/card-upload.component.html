<div class="container mt-5">
  <div class="row">
      <div class="col-md-4">
          <div class="card">
              <img [src]="imageSrc || 'https://via.placeholder.com/150'" class="card-img-top" alt="Image de la carte">
              <div class="card-body">
                 <label for="imageUpload">Choisir une image</label>
                  <input type="file" class="form-control-file" (change)="onFileSelected($event)" accept="image/*">
                  <h3>{{fileName}}</h3>
              </div>
          </div>
      </div>

  </div>
</div>
